apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts-server
  labels:
    app: kokoro-tts-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kokoro-tts-server
  template:
    metadata:
      labels:
        app: kokoro-tts-server
    spec:
      containers:
        - name: kokoro-tts-server
          image: ghcr.io/autoeditor-video-or-audio/kokoro-tts-server:latest-gpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8880
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kokoro-tts-server-config
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kokoro-tts-server-minio
                  key: access_key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kokoro-tts-server-minio
                  key: secret_key
          volumeMounts:
            - name: voices
              mountPath: /app/api/src/voices/v1_0
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: 1
      volumes:
        - name: voices
          persistentVolumeClaim:
            claimName: kokoro-tts-server-voices
