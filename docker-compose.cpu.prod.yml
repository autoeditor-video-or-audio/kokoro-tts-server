# kokoro-tts-server (autoeditor fork of remsky/Kokoro-FastAPI) — CPU.
# Drop-in replacement for the upstream CPU container on host port 8880.
# No NVIDIA runtime; runs on any x86_64 Linux host.
#
# Usage on a CPU host:
#   cp .env.example .env       # edit MinIO creds if needed
#   docker stop kokoro-fastapi-old || true   # free port 8880 if a previous container is there
#   docker compose --env-file .env -f docker-compose.cpu.prod.yml pull
#   docker compose --env-file .env -f docker-compose.cpu.prod.yml up -d
#   docker logs -f kokoro-tts-server
#
# Endpoints (additions over upstream):
#   POST /v1/voices/save-combined    -> persist a weighted blend as a .pt under voices_dir
#   POST /v1/voices/sync-from-minio  -> pull voicepacks from s3://<bucket>/voicepacks/
#   POST /v1/voices/reload           -> flush the upstream voice cache

services:
  kokoro-tts-server:
    container_name: kokoro-tts-server
    image: ghcr.io/autoeditor-video-or-audio/kokoro-tts-server:${KOKORO_IMAGE_TAG:-latest-cpu}
    ports:
      - "${KOKORO_PORT:-8880}:8880"
    environment:
      - ALLOW_LOCAL_VOICE_SAVING=${ALLOW_LOCAL_VOICE_SAVING:-true}
      - KOKORO_SYNC_ON_START=${KOKORO_SYNC_ON_START:-0}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-192.168.15.152:30002}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - MINIO_BUCKET=${MINIO_BUCKET:-tts-training}
      - MINIO_VOICEPACK_PREFIX=${MINIO_VOICEPACK_PREFIX:-voicepacks/}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - USE_GPU=false
      - DEVICE=cpu
    volumes:
      # Persist saved blends + synced voicepacks across container restarts.
      # IMPORTANT: chown the host dir to uid 1001 before first start so the
      # baked-voicepack seed step in the entrypoint can write into it:
      #   sudo mkdir -p ./voices && sudo chown -R 1001:1001 ./voices
      - ./voices:/app/api/src/voices/v1_0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
